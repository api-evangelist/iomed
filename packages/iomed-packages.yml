notes: >-
  IOMED does not publish a public API, so it ships no API-client SDKs. It does
  maintain first-party open-source tooling under the iomedhealth GitHub org. The
  entry below is a genuinely IOMED-authored library published to PyPI (verified).
  The org also mirrors OHDSI / DARWIN-EU OMOP community R packages
  (IncidencePrevalence, CohortConstructor, PatientProfiles, CodelistGenerator,
  CohortSurvival, DrugExposureDiagnostics, OmopHelpers) which are upstream
  community projects, not IOMED-originated, and are intentionally omitted here.
