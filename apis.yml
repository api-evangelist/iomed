aid: iomed
name: Iomed
description: >-
  IOMED is a Barcelona-based health-tech company operating a Data Space Platform
  that gives hospitals and life-science companies secure, GDPR-compliant access
  to real-world clinical data for secondary use and research. Using AI and
  natural language processing, IOMED transforms free-text electronic health
  records into structured, coded data standardized on the OMOP Common Data
  Model, then exposes it through a federated EU network of hospital partners.
  Platform capabilities include feasibility patient counts, aggregated patient
  characterization, patient-level data extraction, and a patient finder for
  clinical-trial recruitment. IOMED is ISO 27001:2022, ISO 27701:2019, and
  ISO 9001:2015 certified, and is backed by Speedinvest, Adara Ventures, XTX
  Markets, and Philips Ventures. This profile is maintained in the API
  Evangelist network; IOMED does not currently publish a public developer API.
